name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies (no Playwright or browser in CI)
        run: python -m pip install pytest pillow
      - name: Byte-compile
        run: python -m compileall -q skills tests
      - name: Validate JSON manifests and data
        shell: python
        run: |
          import json, pathlib, sys
          files = [pathlib.Path(".claude-plugin/plugin.json"), pathlib.Path(".claude-plugin/marketplace.json"),
                   pathlib.Path("config.example.json"), *pathlib.Path("skills").rglob("*.json")]
          bad = 0
          for f in files:
              if ".venv" in f.parts or "runs" in f.parts:
                  continue
              try:
                  json.loads(f.read_text(encoding="utf-8"))
              except ValueError as e:
                  bad += 1
                  print(f"::error file={f}::{e}")
          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          for key in ("name", "version", "description"):
              if not plugin.get(key):
                  bad += 1
                  print(f"::error file=.claude-plugin/plugin.json::missing {key}")
          if not market.get("name") or not market.get("owner", {}).get("name") or not market.get("plugins"):
              bad += 1
              print("::error file=.claude-plugin/marketplace.json::needs name, owner.name and plugins")
          sys.exit(1 if bad else 0)
      - name: Tests
        run: python -m pytest -q

  ci-ok:
    name: ci-ok
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
